name: Deploy Full Stack

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    env:
      VERCEL_ORG_ID: bharadwajmittapelli-4983s-projects
      VERCEL_PROJECT_ID: prj_fW5pBz7VD3638WisBYjngZshh7Eu
      VITE_SUPABASE_URL: https://sgpkxgwnxusjagjnesir.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: --prod
          working-directory: ./client
          github-comment: false

  backend:
    name: Backend (Railway)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          curl -X POST "https://api.railway.com/rpc" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","method":"service.deploy","params":{"service_id":"e4384f28-df8d-47fc-928c-9d6acc6cb415"},"id":1}'
